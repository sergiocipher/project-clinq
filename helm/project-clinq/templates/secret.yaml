# WHY THIS FILE EXISTS:
# Stores the Postgres password and the assembled DATABASE_URL as a Kubernetes
# Secret. Kubernetes base64-encodes Secret values automatically when you use
# `stringData` — you provide plain strings, Kubernetes stores them encoded.
# The backend reads DATABASE_URL from this Secret rather than constructing it
# from multiple env vars, which is simpler and less error-prone.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "project-clinq.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "project-clinq.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s"
    .Values.postgres.user
    .Values.postgres.password
    (include "project-clinq.fullname" .)
    .Values.postgres.database | quote }}
