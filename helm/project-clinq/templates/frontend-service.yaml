# WHY THIS FILE EXISTS:
# ClusterIP Service for the frontend Nginx. The Ingress routes HTTP traffic
# (port 80) to this Service, which forwards it to the container's port 8080.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "project-clinq.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "project-clinq.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "project-clinq.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
