# WHY THIS FILE EXISTS:
# ServiceMonitor tells Prometheus (running via kube-prometheus-stack) to scrape
# the backend's /metrics endpoint. The guard condition checks both the values
# flag AND whether the ServiceMonitor CRD exists in the cluster — this lets
# the chart install cleanly before the monitoring stack is deployed.
{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "project-clinq.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "project-clinq.labels" . | nindent 4 }}
    # This label must match the Prometheus operator's serviceMonitorSelector
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "project-clinq.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
