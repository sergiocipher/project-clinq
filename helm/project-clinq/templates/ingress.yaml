# WHY THIS FILE EXISTS:
# The Ingress is the single entry point from the internet into the cluster.
# It routes:
#   /api  → backend Service (FastAPI)
#   /     → frontend Service (Nginx/React)
# No rewrite rules are needed because the backend routes already start with /api.
# The Ingress Controller (nginx-ingress) creates an AWS Load Balancer to
# receive traffic and forwards it to the appropriate pod.
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "project-clinq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "project-clinq.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "project-clinq.fullname" . }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "project-clinq.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
