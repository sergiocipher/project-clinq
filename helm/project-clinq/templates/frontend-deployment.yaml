# WHY THIS FILE EXISTS:
# Runs the Nginx frontend as a Kubernetes Deployment.
# BACKEND_URL is injected so Nginx knows which internal Service to proxy
# /api/ requests to. The unprivileged Nginx image runs as UID 101 (non-root)
# and listens on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "project-clinq.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "project-clinq.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "project-clinq.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "project-clinq.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "frontend.image.tag must be set to a commit SHA" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://{{ include "project-clinq.fullname" . }}-backend:8000"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
