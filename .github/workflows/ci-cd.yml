# WHY THIS FILE EXISTS:
# Automates the full pipeline on every push/PR to main:
#   test → build → Trivy scan → push to GHCR (push only, not PRs)
#   An optional deploy job updates the EKS cluster (disabled until DEPLOY_ENABLED=true).
#
# Key decisions:
# - Trivy scans BEFORE push: we never publish a vulnerable image.
# - SHA tags only: 'latest' is never used so every deployment is traceable.
# - Matrix strategy: backend and frontend build/scan/push in parallel.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read   # default — least privilege

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Python / backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Ruff lint + format check
        run: ruff check . && ruff format --check .
        working-directory: backend

      - name: pytest
        run: pytest -v
        working-directory: backend

      # Node / frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci + build
        run: npm ci && npm run build
        working-directory: frontend

  # ── 2. Build → Scan → Push ─────────────────────────────────────────────────
  build-scan-push:
    name: Build / Trivy Scan / Push (${{ matrix.service }})
    needs: test
    # Only run on push to main, not on pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first so Trivy can scan it BEFORE it is published
      - name: Build image (local load, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Scan — the job fails on HIGH or CRITICAL unfixed CVEs.
      # Never lower this gate. Fix the root cause (update base image or dep).
      - name: Trivy scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      # Push only if scan passed — same build args for reproducibility
      - name: Push image (SHA tag only, never latest)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 3. Deploy (optional, disabled until DEPLOY_ENABLED=true) ───────────────
  deploy:
    name: Deploy to EKS
    needs: build-scan-push
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy   # only one deploy at a time

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.1"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.EKS_CLUSTER_NAME }}

      - name: Helm upgrade / install
        run: |
          helm upgrade --install project-clinq helm/project-clinq \
            -n project-clinq --create-namespace \
            -f helm/project-clinq/values-eks.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set postgres.password=${{ secrets.DB_PASSWORD }} \
            --atomic --wait --timeout 5m
